spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quotes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_API_MODEL:openai/gpt-oss-20b}
groq.api.url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
